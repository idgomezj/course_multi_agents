name: NLP classroom demo validation

on:
  pull_request:
    branches: [main]
    paths: ["nlp-foundations/**", ".github/workflows/nlp-foundations.yml"]
  push:
    branches: [main]
    paths: ["nlp-foundations/**", ".github/workflows/nlp-foundations.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spaCy
        run: python -m pip install -r nlp-foundations/requirements.txt
      - name: Install supervised ML example dependencies
        run: python -m pip install -r nlp-foundations/requirements_ml.txt
      - name: Unit tests
        run: python -m unittest discover -s nlp-foundations/tests -v
      - name: Benchmark HTML smoke test
        run: python nlp-foundations/benchmark_nlp_aws.py --omitir-preentrenado --muestras 20 --salida /tmp/informe_nlp_aws.html
      - name: Instructor demo smoke test
        run: python nlp-foundations/demo_nlp.py --ejemplos
