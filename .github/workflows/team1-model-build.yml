name: Build Team 1 model artifacts

on:
  push:
    branches:
      - solution/team_1
    paths:
      - ".github/workflows/team1-model-build.yml"

permissions:
  contents: write

jobs:
  build-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install training dependencies
        run: python -m pip install --upgrade pip torch numpy pandas

      - name: Reconstruct Team 1 assignment history
        run: |
          git show 4feb5083e043b6532e554e4323489a10c90e988d:agentic-operations-intelligence-challenge/student/team_1/training/raw_case_history.csv > /tmp/team1_raw.csv
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          frame = pd.read_csv("/tmp/team1_raw.csv")
          records = frame.where(pd.notna(frame), None).to_dict(orient="records")
          out = Path("agentic-operations-intelligence-challenge/student/team_1/training/raw_source.json")
          out.write_text(json.dumps({"records": records}), encoding="utf-8")
          PY

      - name: Build leakage-safe datasets and train
        working-directory: agentic-operations-intelligence-challenge
        run: |
          python student/team_1/training/build_dataset.py
          python student/team_1/training/train_team1.py

      - name: Commit trained artifacts only
        run: |
          rm -f agentic-operations-intelligence-challenge/student/team_1/training/raw_source.json
          rm -f agentic-operations-intelligence-challenge/student/team_1/training/model_a_training.csv
          rm -f agentic-operations-intelligence-challenge/student/team_1/training/model_b_training.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentic-operations-intelligence-challenge/student/team_1/models/model_a.pt2
          git add agentic-operations-intelligence-challenge/student/team_1/models/model_b.pt2
          if git diff --cached --quiet; then
            echo "Model artifacts already current"
          else
            git commit -m "feat(team1): add trained PyTorch model artifacts"
            git push origin HEAD:solution/team_1
          fi
