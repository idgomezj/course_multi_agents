name: Full NLP benchmark (all 3)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nlp-foundations/benchmark_nlp_aws.py"
      - "nlp-foundations/README_BENCHMARK_AWS.md"
      - "nlp-foundations/requirements_benchmark.txt"
      - ".github/workflows/nlp-full-benchmark.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all model dependencies
        run: python -m pip install -r nlp-foundations/requirements_benchmark.txt
      - name: Run three actual models and measure resource usage
        run: |
          python nlp-foundations/benchmark_nlp_aws.py \
            --target-rps 100 --duration-s 2.5 \
            --workers 2 --max-in-flight 5 \
            --samples 200 --samples-pretrained 12
      - name: Upload full report, even if a model failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlp-benchmark-measured-report
          path: |
            nlp-foundations/informe_benchmark_real.html
            nlp-foundations/benchmark_mediciones.json
          if-no-files-found: warn
