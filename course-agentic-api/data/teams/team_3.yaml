name: Team 3 — Just-in-Time Manufacturing
description: The plant holds minimal raw-material inventory and depends on frequent, precisely timed supplier deliveries.
objective: Synchronize supply and production so inventory stays very low without exposing the plant to costly line stops.
cost_priorities: [line stop, late material, excess inventory, delivery timing]
costs:
  holding_per_unit_week: 7.5
  line_stop_per_hour: 18000
  stockout_per_unit: 18
  lost_sale_per_unit: 24
  expedite_per_unit: 5.0
  working_capital_rate: 0.035
materials:
  RM01: {initial_inventory: 1450}
  RM02: {initial_inventory: 900}
  RM03: {initial_inventory: 520}
  RM04: {initial_inventory: 300}
  RM05: {initial_inventory: 1550}
  RM06: {initial_inventory: 1600}
policies:
  service_level_target: 0.985
  max_overtime_hours_per_line_week: 8
public_scenarios:
  - id: T3-P01
    title: Cheap supplier with unstable arrival
    visible:
      supplier_recent_late_rate: {SUP02: 0.38, SUP04: 0.03}
      season_risk: 0.45
    realized:
      supplier_delay_days: {SUP02: 4, SUP04: 0}
    benchmark_cost: 61000
    public_expectations:
      required_tools: [get_open_purchase_orders, predict_supplier_delay, predict_arrival_time, calculate_jit_requirement, calculate_plan_cost, search_knowledge]
      discouraged_tools: [calculate_safety_stock]
      rag_expected_sources: [operations_policy.md, supplier_contracts.md]
  - id: T3-P02
    title: Production date pulled forward
    visible:
      production_date_change_days: -3
      supplier_recent_late_rate: {SUP03: 0.10}
    realized:
      supplier_delay_days: {SUP03: 1}
    benchmark_cost: 63500
    public_expectations:
      required_tools: [predict_arrival_time, calculate_jit_requirement, get_inventory, validate_plan]
      discouraged_tools: [calculate_safety_stock]
      rag_expected_sources: [operations_policy.md]
  - id: T3-P03
    title: Micro-buffer versus line-stop exposure
    visible:
      supplier_recent_late_rate: {SUP01: 0.18}
      season_risk: 0.35
    realized:
      supplier_delay_days: {SUP01: 2}
    benchmark_cost: 60000
    public_expectations:
      required_tools: [predict_supplier_delay, calculate_jit_requirement, calculate_plan_cost, search_knowledge]
      discouraged_tools: [calculate_reorder_point]
      rag_expected_sources: [operations_policy.md]
