name: Team 2 — Stable Make-to-Stock
description: Mature products have stable demand; inventory carrying cost and working capital are the dominant concerns.
objective: Meet service with a simple stable plan while minimizing excess inventory, warehouse use and capital tied up.
cost_priorities: [holding inventory, working capital, excess inventory]

company_profile:
  legal_name: Harbor Essentials Manufacturing
  industry: mature household staples
  operating_model: stable make-to-stock production with high inventory and working-capital sensitivity
  customer_mix:
    wholesale: 0.55
    retail: 0.35
    direct: 0.10
  planning_horizon_weeks: 4
  management_concerns:
    - excess stock from bulk purchasing
    - warehouse utilization
    - working capital tied up in slow-moving goods
    - maintaining service without reacting to normal noise

customer_priorities:
  core_accounts:
    service_target: 0.97
    priority: high
  other_channels:
    service_target: 0.95
    priority: normal

constraints:
  monthly_operating_budget: 54000
  max_monthly_overtime_hours: 56
  max_expedited_units: 180
  max_finished_goods_inventory_units: 4200

data_quality_context:
  raw_history_is_imperfect: true
  expected_issues: [missing values, duplicate uploads, inconsistent identifiers, corrected receipts, occasional planner notes]
  instruction: Stable business behavior means extreme observations require investigation rather than automatic extrapolation.

decision_signals:
  may_disagree: [Model A forecast, Model B excess-inventory risk, confirmed orders, moving average, open purchase orders, volume-discount economics]
  principle: A cheap bulk order can still be economically wrong when inventory and working-capital costs are included.

products:
  FG01: {demand_history: [1010, 1005, 1020, 995, 1008, 1012, 1001, 1007]}
  FG02: {demand_history: [810, 815, 805, 820, 812, 808, 818, 811]}
  FG03: {demand_history: [625, 630, 620, 628, 632, 627, 624, 629]}
costs:
  stockout_per_unit: 10
  lost_sale_per_unit: 12
  holding_per_unit_week: 4.0
  working_capital_rate: 0.055
  expedite_per_unit: 1.0
policies:
  service_level_target: 0.965
public_scenarios:
  - id: T2-P01
    title: Stable month with excessive opening stock
    visible:
      confirmed_orders: {FG01: 1010, FG02: 815, FG03: 630}
    realized:
      demand_multiplier: {FG01: 0.99, FG02: 1.01, FG03: 1.0}
    benchmark_cost: 45500
    public_expectations:
      required_tools: [forecast_moving_average, get_inventory, get_open_purchase_orders, calculate_plan_cost]
      discouraged_tools: [calculate_safety_stock, calculate_jit_requirement]
      rag_expected_sources: [operations_policy.md]
  - id: T2-P02
    title: Volume discount versus working capital
    visible:
      confirmed_orders: {FG01: 980}
    realized:
      demand_multiplier: {FG01: 0.96, FG02: 1.0, FG03: 1.0}
    benchmark_cost: 44000
    public_expectations:
      required_tools: [forecast_moving_average, get_supplier_options, calculate_plan_cost, search_knowledge]
      discouraged_tools: [forecast_seasonal]
      rag_expected_sources: [supplier_contracts.md, operations_policy.md]
  - id: T2-P03
    title: Gradual demand decline
    visible:
      confirmed_orders: {FG02: 760}
    realized:
      demand_multiplier: {FG02: [0.96, 0.92, 0.88, 0.84]}
    benchmark_cost: 43000
    public_expectations:
      required_tools: [forecast_exponential_smoothing, get_inventory, calculate_plan_cost]
      discouraged_tools: [calculate_safety_stock]
      rag_expected_sources: [operations_policy.md]
