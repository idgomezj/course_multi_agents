name: Team 4 — Unreliable Supply Network
description: Critical materials come from suppliers with long lead-time variability, quality failures and disruption risk.
objective: Protect service and production continuity through risk-aware sourcing and economically justified buffers.
cost_priorities: [supplier failure, quality, line shutdown, expedite]

company_profile:
  legal_name: Sentinel Supply Manufacturing
  industry: manufacturing with critical imported raw materials
  operating_model: multi-supplier procurement under delivery and quality uncertainty
  customer_mix:
    strategic_contracts: 0.65
    standard_accounts: 0.35
  planning_horizon_weeks: 4
  management_concerns:
    - long lead-time variability
    - quality rejection on critical materials
    - correlated supplier disruptions
    - emergency sourcing cost

customer_priorities:
  strategic_contracts:
    service_target: 0.99
    priority: high
  standard_accounts:
    service_target: 0.96
    priority: normal

constraints:
  monthly_operating_budget: 82000
  max_monthly_overtime_hours: 64
  max_expedited_units: 450
  max_finished_goods_inventory_units: 4500

data_quality_context:
  raw_history_is_imperfect: true
  expected_issues: [missing reliability observations, missing quality scores, partial receipts, inconsistent supplier IDs, process-change notes]
  instruction: Delay risk and quality risk are distinct outcomes; do not collapse them into a single supplier score.

decision_signals:
  may_disagree: [Model A delay risk, Model B quality risk, nominal lead time, unit price, supplier reliability, recent rejection rate]
  principle: No supplier is globally best; choose using material criticality, timing, quality, cost and contract evidence.

costs:
  holding_per_unit_week: 0.55
  line_stop_per_hour: 24000
  stockout_per_unit: 26
  lost_sale_per_unit: 34
  expedite_per_unit: 6.2
policies:
  service_level_target: 0.985
public_scenarios:
  - id: T4-P01
    title: Low-price supplier with delay risk
    visible:
      supplier_recent_late_rate: {SUP02: 0.51, SUP04: 0.04}
      season_risk: 0.65
    realized:
      supplier_delay_days: {SUP02: 8, SUP04: 0}
    benchmark_cost: 66500
    public_expectations:
      required_tools: [predict_supplier_delay, find_alternative_supplier, calculate_plan_cost, search_knowledge]
      rag_expected_sources: [supplier_contracts.md]
  - id: T4-P02
    title: Supplier quality deterioration
    visible:
      supplier_recent_reject_rate: {SUP02: 0.20}
      supplier_process_change: {SUP02: 1}
    realized:
      supplier_reject_fraction: {SUP02: 0.28}
    benchmark_cost: 69000
    public_expectations:
      required_tools: [predict_supplier_quality, find_alternative_supplier, search_knowledge, validate_plan]
      rag_expected_sources: [supplier_contracts.md, operations_policy.md]
  - id: T4-P03
    title: Dual-source disruption
    visible:
      supplier_recent_late_rate: {SUP01: 0.36, SUP02: 0.44}
      season_risk: 0.7
    realized:
      supplier_delay_days: {SUP01: 5, SUP02: 7}
    benchmark_cost: 73500
    public_expectations:
      required_tools: [predict_supplier_delay, find_alternative_supplier, calculate_plan_cost, validate_plan]
      rag_expected_sources: [supplier_contracts.md]
