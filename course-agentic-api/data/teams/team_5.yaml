name: Team 5 — Capacity-Constrained Plant
description: Materials and demand are manageable, but line capacity, downtime, changeovers and overtime dominate decisions.
objective: Meet customer demand with a feasible schedule while minimizing downtime, overtime, changeovers and outsourcing pressure.
cost_priorities: [downtime, late delivery, overtime, changeovers]
costs:
  holding_per_unit_week: 0.45
  line_stop_per_hour: 21000
  overtime_per_hour: 380
  changeover_cost: 3200
  stockout_per_unit: 28
  lost_sale_per_unit: 36
lines:
  L1: {weekly_hours: 118, utilization: 0.94, recent_downtime: 10, maintenance_age_days: 90}
  L2: {weekly_hours: 102, utilization: 0.91, recent_downtime: 12, maintenance_age_days: 110}
policies:
  service_level_target: 0.98
  max_overtime_hours_per_line_week: 14
public_scenarios:
  - id: T5-P01
    title: High downtime risk on Line 1
    visible:
      recent_downtime: {L1: 18}
      maintenance_age_days: {L1: 145}
      utilization: {L1: 0.98}
    realized:
      downtime_hours: {L1: [16, 7, 5, 4]}
    benchmark_cost: 68000
    public_expectations:
      required_tools: [predict_downtime, get_production_capacity, calculate_overtime_option, calculate_plan_cost, search_knowledge]
      rag_expected_sources: [operations_policy.md]
  - id: T5-P02
    title: Changeover-heavy product mix
    visible:
      expected_changeovers: {L1: 5, L2: 4}
      utilization: {L1: 0.95, L2: 0.94}
    realized:
      demand_multiplier: {FG01: 1.08, FG02: 1.12, FG03: 1.05}
    benchmark_cost: 70000
    public_expectations:
      required_tools: [predict_production_feasibility, get_production_capacity, calculate_plan_cost, validate_plan]
      rag_expected_sources: [operations_policy.md]
  - id: T5-P03
    title: Capacity loss and urgent demand
    visible:
      overload: {L2: 0.28}
      labor_ratio: {L2: 0.78}
      confirmed_orders: {FG03: 820}
    realized:
      demand_multiplier: {FG03: [1.18, 1.28, 1.20, 1.10]}
      downtime_hours: {L2: [12, 14, 8, 5]}
    benchmark_cost: 76000
    public_expectations:
      required_tools: [predict_downtime, predict_production_feasibility, calculate_overtime_option, validate_plan, search_knowledge]
      rag_expected_sources: [operations_policy.md]
