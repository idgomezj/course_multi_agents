model: "models/qwen3-0.6b-base-bf16"

train: true

fine_tune_type: lora

optimizer: adamw

optimizer_config:
  adamw:
    weight_decay: 0.01

data: "data"

seed: 42

# -1 applies LoRA conversion across all
# Transformer layers.
num_layers: -1

batch_size: 1

iters: 80

val_batches: -1

learning_rate: 1e-5

steps_per_report: 5

steps_per_eval: 10

grad_accumulation_steps: 4

adapter_path: "outputs/lora_adapter"

save_every: 20

test: false

max_seq_length: 256

grad_checkpoint: true

mask_prompt: true

lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.v_proj"
  rank: 8
  scale: 20.0
  dropout: 0.0
